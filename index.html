
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Для группы ❤️</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Canvas для анимации звезд и рисования сердца -->
  <canvas id="canvas"></canvas>
  <!-- Интерактивный оверлей -->
  <div class="overlay">
    
    <!-- Панель управления сверху -->
    <div class="top-controls">
      <button id="musicBtn" class="glass-btn" title="Включить романтичную мелодию">
        <span class="icon">🎵</span> <span id="musicText">Музыка: Выкл</span>
      </button>
    </div>
    <!-- Блок с романтичным посланием (появляется после завершения рисунка) -->
    <div id="messageBox" class="message-box">
      <h1 id="loveTitle" class="love-title">Любимой группе МК-261</h1>
      <p id="loveText" class="love-text">
        Математика соединила нас формулами, а универ — крепкой дружбой.
        Пусть наше счастье будет константой, а успех всегда стремится к бесконечности! ♾️
      </p>
      <div class="message-actions">
        <button id="replayBtn" class="action-btn">
          <span>✨ Заново</span>
        </button>
      </div>
    </div>
    <!-- Подсказка в начале -->
    <div id="hintText" class="hint-text">
      Коснись экрана или наблюдай за магией...
    </div>
  </div>
  <!-- Canvas поверх интерфейса для интерактивных сердечек от кликов -->
  <canvas id="heartsCanvas"></canvas>
  <script src="script.js"></script>
</body>
